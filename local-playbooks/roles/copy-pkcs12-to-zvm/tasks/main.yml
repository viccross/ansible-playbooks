---
- name: Copy the package to the ELAN
  ansible.posix.synchronize:
    src: /etc/pki/tls/certs/{{ item }}.p12
    dest: /etc/pki/tls/certs/{{ item }}.p12
  loop:
    - "zVM"
    - "zVMLDAP"
  delegate_to: lxwork01

- name: Start the FTP server on z/VM # noqa no-changed-when command-instead-of-shell
  ansible.builtin.shell:
    cmd: /usr/local/bin/smcli ia -T FTPSERVE -H {{ smapi_host | quote }}/44444 -U {{ smapi_user | quote }} -P {{ smapi_password | quote }} && sleep 2
  register: ret
  failed_when:
    - ret.rc != 0
    - '"Image already active" not in ret.stdout'

- name: Copy the package # noqa command-instead-of-module command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    cmd: curl -v -T /etc/pki/tls/certs/zVM.p12 -Q "CWD /../VMBFS:VMSYS:GSKSSLDB/" ftp://MAINT.BY.IBMVM1:{{ ibmvm1_pass }}@{{ zvm_internal_ip_address }}/

- name: Copy the package # noqa command-instead-of-module command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    cmd: curl -v -T /etc/pki/tls/certs/zVMLDAP.p12 -Q "CWD /../VMBFS:VMSYS:GSKSSLDB/" ftp://MAINT.BY.IBMVM1:{{ ibmvm1_pass }}@{{ zvm_internal_ip_address }}/

- name: Stop the FTP server on z/VM # noqa command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    cmd: /usr/local/bin/smcli id -T FTPSERVE -H {{ smapi_host | quote }}/44444 -U {{ smapi_user | quote }} -P {{ smapi_password | quote }}

- name: Run the certificate import task # noqa command-instead-of-shell no-changed-when
  ansible.builtin.shell:
    chdir: /usr/local/bin
    cmd: LDAPSRVcert.expect Y:{{ zvm_internal_ip_address }} "GSKADMIN BY {{ smapi_user }}" {{ smapi_password }}
